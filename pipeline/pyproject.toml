[project]
name = "citydef"
version = "0.1.0"
description = "Offline data pipeline for city-scale v2: city definitions, metrics, exports"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "shapely>=2.0",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "duckdb>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citydef"]
